name: Publish FastFlow

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/smoke.sh

  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish the version from VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { printing = 1; next }
            printing && /^## / { exit }
            printing
          ' CHANGELOG.md > /tmp/fastflow-release-notes.md
          grep -q '[[:alnum:]]' /tmp/fastflow-release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "FastFlow $version" \
            --notes-file /tmp/fastflow-release-notes.md ff.sh setup.sh
